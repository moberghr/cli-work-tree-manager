<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>work web — sessions</title>
    <!-- Stamp the theme on <html> before first paint so there's no
         light-then-dark flash. The cached choice (wd:theme; in work web a
         mirror of config.json) wins: a named theme is dark plus its own
         data-app-theme; anything else follows the OS. The appearance store
         (state/appearance.ts) takes over once the app loads. -->
    <script>
      (function () {
        var d = document.documentElement;
        try {
          var t = localStorage.getItem('wd:theme');
          if (t === 'midnight' || t === 'dracula' || t === 'tokyo-night') {
            d.dataset.appTheme = t;
            t = 'dark';
          } else if (t !== 'light' && t !== 'dark') {
            t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          d.dataset.theme = t;
        } catch (e) {
          d.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
