# Publishes the package to npm, bumps the Homebrew tap formula, and ships the
# desktop app (Velopack) whenever a GitHub Release is published.
#
# npm auth uses Trusted Publishing (OIDC) — no NPM_TOKEN secret. One-time setup
# on npmjs.com: package @moberg_hr/work-tree -> Settings -> Trusted Publisher ->
# GitHub Actions, org/user "moberghr", repo "cli-work-tree-manager", workflow
# "release.yml". Requires npm CLI >= 11.5.1, which Node 24 bundles (npm 11.9+),
# so there is no global npm install step to drift out of sync with the runner.
#
# Required repository secrets:
#   HOMEBREW_TAP_TOKEN - PAT (contents:write) on moberghr/homebrew-work-tree
#
# Release flow: create a GitHub Release tagged vX.Y.Z on main — the tag is the
# version (scripts/version.mjs; package.json keeps 0.0.0-dev, nothing to bump).
# This workflow sets the version from the tag in each job before anything is
# built, publishes the exact packed tarball to npm, then points the tap's
# Formula/work.rb at the new url + sha256.
# Then the desktop job packs the app for Windows, macOS (arm64) and Linux and
# uploads each installer + update feed to the same release; the macOS one
# also writes the tap's Casks/work-desktop.rb for that zip.
name: Release

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # mint the OIDC token npm exchanges for publish credentials

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci
      # The release tag is the version (scripts/version.mjs): package.json keeps
      # a placeholder, set here for npm; WORK_VERSION goes into every build.
      - name: Version from the release tag
        shell: bash
        run: |
          TAG="${{ github.event.release.tag_name }}"
          VERSION="${TAG#v}"
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::Release tag '$TAG' is not vX.Y.Z"
            exit 1
          fi
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "WORK_VERSION=$VERSION" >> "$GITHUB_ENV"
      - run: npm run typecheck
      # Build first, as CI does: the functional tests start work web, which serves dist/web.
      - run: npm run build
      - run: npm test

      - name: Pack tarball and compute sha256
        run: |
          TARBALL="$(npm pack --silent)"
          SHA256="$(shasum -a 256 "$TARBALL" | cut -d' ' -f1)"
          echo "TARBALL=$TARBALL" >> "$GITHUB_ENV"
          echo "SHA256=$SHA256" >> "$GITHUB_ENV"
          echo "Packed $TARBALL  sha256=$SHA256"

      - name: Publish to npm (trusted publishing / OIDC)
        run: npm publish "$TARBALL" --access public

      - name: Update Homebrew tap formula
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/moberghr/homebrew-work-tree.git" tap
          FORMULA="tap/Formula/work.rb"
          URL="https://registry.npmjs.org/@moberg_hr/work-tree/-/work-tree-${VERSION}.tgz"
          sed -i -E "s#^( *url )\".*\"#\1\"${URL}\"#" "$FORMULA"
          sed -i -E "s#^( *sha256 )\".*\"#\1\"${SHA256}\"#" "$FORMULA"

          cd tap
          if git diff --quiet; then
            echo "Formula already up to date for ${VERSION} — nothing to push."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/work.rb
          git commit -m "work ${VERSION}"
          git push

  # The desktop app (desktop/), with the work CLI inside it, as a Velopack
  # installer + self-updating package on the same release (desktop/scripts/
  # velopack.mjs). Each platform on its own OS: the CLI's native modules
  # (better-sqlite3, node-pty) are built for the machine that stages them, on
  # the Node the package carries — so that Node is pinned exactly.
  desktop:
    needs: publish
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest # win-x64
          - os: macos-latest # osx-arm64
          - os: ubuntu-22.04 # linux-x64; the oldest glibc we build on is the oldest the AppImage runs on
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write # vpk uploads the packages to the release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install vpk
        run: dotnet tool install -g vpk --version 1.2.161

      - name: Tauri's Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev patchelf build-essential

      - run: npm ci

      # The release tag is the version (scripts/version.mjs), as in the publish job.
      - name: Version from the release tag
        shell: bash
        run: |
          TAG="${{ github.event.release.tag_name }}"
          VERSION="${TAG#v}"
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::Release tag '$TAG' is not vX.Y.Z"
            exit 1
          fi
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          echo "WORK_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Pack and publish
        env:
          PUBLISH: '1'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node desktop/scripts/velopack.mjs

      # `brew install --cask moberghr/work-tree/work-desktop`: the canonical cask
      # (packaging/homebrew/work-desktop.rb) with this release's version and the
      # sha256 of the zip just uploaded, written to the tap's Casks/.
      - name: Update Homebrew tap cask
        if: runner.os == 'macOS'
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          ZIP="desktop/artifacts/velopack/osx-arm64/releases/WorkDesktop-osx-Portable.zip"
          SHA256="$(shasum -a 256 "$ZIP" | cut -d' ' -f1)"
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/moberghr/homebrew-work-tree.git" tap
          mkdir -p tap/Casks
          CASK="tap/Casks/work-desktop.rb"
          sed -E -e "s#^( *version )\".*\"#\1\"${VERSION}\"#" -e "s#^( *sha256 )\".*\"#\1\"${SHA256}\"#" \
            packaging/homebrew/work-desktop.rb > "$CASK"

          cd tap
          git add Casks/work-desktop.rb
          if git diff --cached --quiet; then
            echo "Cask already up to date for ${VERSION} — nothing to push."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "work-desktop ${VERSION}"
          git push
